<title id="FAOA-2015-DIAGRAM-CH06-015-title">Diagram FAOA-2015-DIAGRAM-CH06-015</title><desc id="FAOA-2015-DIAGRAM-CH06-015-desc">Barisan eksak pendek ruang Banach: ruang nol menuju A, lalu pemetaan S dari A ke B, lalu pemetaan T dari B ke C, lalu C menuju ruang nol. Eksak berarti S injektif, T surjektif, dan jangkauan S sama dengan kernel T. Ini barisan berarah, bukan diagram komutatif bercabang.</desc><defs>
