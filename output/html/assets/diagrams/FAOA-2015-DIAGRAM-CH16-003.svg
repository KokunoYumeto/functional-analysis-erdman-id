<title id="FAOA-2015-DIAGRAM-CH16-003-title">Diagram FAOA-2015-DIAGRAM-CH16-003</title><desc id="FAOA-2015-DIAGRAM-CH16-003-desc">Persegi tarik balik. P berada di kiri atas, A dua di kanan atas, A satu di kiri bawah, dan B di kanan bawah. Panahnya pi dua dari P ke A dua, pi satu dari P ke A satu, phi dua dari A dua ke B, dan phi satu dari A satu ke B. Persegi komutatif: phi dua setelah pi dua sama dengan phi satu setelah pi satu.</desc><defs>
