<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="94.17558pt" height="75.373469pt" viewBox="185.62782 72.728938 94.17558 75.373469" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH06-014-title FAOA-2015-DIAGRAM-CH06-014-desc">
<title id="FAOA-2015-DIAGRAM-CH06-014-title">Diagram FAOA-2015-DIAGRAM-CH06-014</title><desc id="FAOA-2015-DIAGRAM-CH06-014-desc">Persegi kealamian antara funktor F dan G. Panah horizontal atas adalah dual dari T garis-atas, dari dual C garis-atas ke dual B garis-atas; panah horizontal bawah adalah hasil bagi bergaris-atas dari T bintang, dari hasil bagi bergaris-atas C bintang ke hasil bagi bergaris-atas B bintang. Isomorfisme vertikal phi sub-C dan phi sub-B menghubungkan objek atas dengan objek bawah. Persegi komutatif: phi sub-B setelah dual T garis-atas sama dengan hasil bagi bergaris-atas T bintang setelah phi sub-C.</desc><defs>
