<title id="FAOA-2015-DIAGRAM-CH04-006-title">Diagram FAOA-2015-DIAGRAM-CH04-006</title><desc id="FAOA-2015-DIAGRAM-CH04-006-desc">Diagram sifat bebas untuk monoid atau semigrup F pada S. Inklusi iota membawa S ke himpunan dasar F, fungsi f membawa S ke himpunan dasar semigrup G, dan satu-satunya homomorfisme putus-putus f tilde dari F ke G menimbulkan panah pada himpunan dasar. Komutativitas menyatakan f sama dengan himpunan dasar f tilde setelah iota.</desc><defs>
