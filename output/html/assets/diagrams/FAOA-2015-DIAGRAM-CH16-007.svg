<title id="FAOA-2015-DIAGRAM-CH16-007-title">Diagram FAOA-2015-DIAGRAM-CH16-007</title><desc id="FAOA-2015-DIAGRAM-CH16-007-desc">Persegi panjang komutatif yang mendefinisikan rho. Baris atas membawa B(H) tambah langsung B(H) secara kanonik ke B(H tambah langsung H), lalu melalui isomorfisme nu ke B(H). Panah vertikal kiri adalah pi tambah langsung pi menuju Q(H) tambah langsung Q(H), dan panah vertikal kanan adalah pi menuju Q(H). Panah bawah rho menuju Q(H) dipilih agar komposit bawah sama dengan komposit atas lalu pi.</desc><defs>
