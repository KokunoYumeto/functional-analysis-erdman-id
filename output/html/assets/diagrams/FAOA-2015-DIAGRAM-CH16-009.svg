<title id="FAOA-2015-DIAGRAM-CH16-009-title">Diagram FAOA-2015-DIAGRAM-CH16-009</title><desc id="FAOA-2015-DIAGRAM-CH16-009-desc">Segitiga sifat pengangkatan positif lengkap. Pemetaan phi tilde membawa A ke B, pemetaan hasil bagi kanonik membawa B ke B per J, dan phi membawa A langsung ke B per J. Segitiga komutatif: pemetaan hasil bagi setelah phi tilde sama dengan phi. Pemetaan phi dan pengangkatannya phi tilde positif lengkap.</desc><defs>
