<title id="FAOA-2015-DIAGRAM-PREFACE-001-title">Diagram FAOA-2015-DIAGRAM-PREFACE-001</title><desc id="FAOA-2015-DIAGRAM-PREFACE-001-desc">Diagram persegi dengan R di kiri atas, U di kanan atas, S di kiri bawah, dan T di kanan bawah. Panahnya adalah j dari R ke U, f dari R ke S, h dari U ke T, dan k dari S ke T. Diagram komutatif tepat ketika h setelah j sama dengan k setelah f.</desc><defs>
