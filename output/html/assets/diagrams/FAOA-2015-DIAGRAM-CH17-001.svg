<title id="FAOA-2015-DIAGRAM-CH17-001-title">Diagram FAOA-2015-DIAGRAM-CH17-001</title><desc id="FAOA-2015-DIAGRAM-CH17-001-desc">Diagram sifat universal grup Grothendieck. Pemetaan gamma membawa semigrup S ke semigrup dasar G(S), pemetaan aditif phi membawa S ke semigrup dasar grup Abel H, dan panah putus-putus himpunan dasar psi membawa G(S) ke H; di tingkat grup terdapat satu-satunya homomorfisme putus-putus psi dari G(S) ke H. Segitiga komutatif: phi sama dengan psi setelah gamma.</desc><defs>
