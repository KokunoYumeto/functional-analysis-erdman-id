<title id="FAOA-2015-DIAGRAM-CH17-002-title">Diagram FAOA-2015-DIAGRAM-CH17-002</title><desc id="FAOA-2015-DIAGRAM-CH17-002-desc">Persegi funktorialitas konstruksi Grothendieck. Panah atas phi membawa S ke T; panah vertikal gamma sub-S dan gamma sub-T membawa keduanya ke G(S) dan G(T); panah bawah G(phi) membawa G(S) ke G(T). Persegi komutatif: gamma sub-T setelah phi sama dengan G(phi) setelah gamma sub-S.</desc><defs>
