<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="94.841998pt" height="64.91611pt" viewBox="185.837903 70.734745 94.841998 64.91611" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH06-022-title FAOA-2015-DIAGRAM-CH06-022-desc">
<title id="FAOA-2015-DIAGRAM-CH06-022-title">Diagram FAOA-2015-DIAGRAM-CH06-022</title><desc id="FAOA-2015-DIAGRAM-CH06-022-desc">Persegi kealamian transformasi tau dari funktor F ke G. Objek-objeknya adalah F(A) di kiri atas, F(A prima) di kanan atas, G(A) di kiri bawah, dan G(A prima) di kanan bawah. Panah horizontal atas adalah F(alpha), panah horizontal bawah adalah G(alpha), sedangkan panah vertikalnya tau sub-A dan tau sub-A-prima. Persegi komutatif: tau sub-A-prima setelah F(alpha) sama dengan G(alpha) setelah tau sub-A.</desc><defs>
