<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="238.514891pt" height="65.657513pt" viewBox="172.848608 72.730894 238.514891 65.657513" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH04-010-title FAOA-2015-DIAGRAM-CH04-010-desc">
<title id="FAOA-2015-DIAGRAM-CH04-010-title">Diagram FAOA-2015-DIAGRAM-CH04-010</title><desc id="FAOA-2015-DIAGRAM-CH04-010-desc">Diagram sifat universal hasil kali P dari A satu dan A dua. Panah proyeksi pi satu dan pi dua berjalan dari P ke masing-masing faktor. Dari objek B terdapat panah f satu ke A satu dan f dua ke A dua, serta satu-satunya panah f dari B ke P. Kedua segitiga komutatif: pi satu setelah f sama dengan f satu, dan pi dua setelah f sama dengan f dua.</desc><defs>
