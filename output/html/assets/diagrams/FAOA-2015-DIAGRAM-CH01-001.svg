<title id="FAOA-2015-DIAGRAM-CH01-001-title">Diagram FAOA-2015-DIAGRAM-CH01-001</title><desc id="FAOA-2015-DIAGRAM-CH01-001-desc">Segitiga vektor yang menggambarkan metrik terinduksi norma. Vektor x dan y berawal pada titik asal yang sama, sedangkan sisi berarah dari ujung y ke ujung x berlabel x dikurangi y. Panjang sisi penghubung itu adalah norma x dikurangi y, yaitu jarak antara x dan y. Ini ilustrasi geometris, bukan diagram komutatif.</desc><defs>
