<title id="FAOA-2015-DIAGRAM-CH06-013-title">Diagram FAOA-2015-DIAGRAM-CH06-013</title><desc id="FAOA-2015-DIAGRAM-CH06-013-desc">Empat panah satu langkah mendefinisikan dua funktor kontravarian. Funktor F membawa objek B ke dual dari B garis-atas dan membawa morfisme T ke dual dari T garis-atas. Funktor G membawa B ke hasil bagi bergaris-atas dari B bintang dan membawa T ke hasil bagi bergaris-atas dari T bintang. Tampilan ini mendaftarkan aksi kedua funktor pada objek dan morfisme; tidak menyatakan diagram komutatif.</desc><defs>
