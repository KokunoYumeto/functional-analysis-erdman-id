<title id="FAOA-2015-DIAGRAM-CH16-004-title">Diagram FAOA-2015-DIAGRAM-CH16-004</title><desc id="FAOA-2015-DIAGRAM-CH16-004-desc">Persegi kerucut calon bagi tarik balik. Q berada di kiri atas, A dua di kanan atas, A satu di kiri bawah, dan B di kanan bawah. Panah rho dua dari Q ke A dua dan rho satu dari Q ke A satu memenuhi phi dua setelah rho dua sama dengan phi satu setelah rho satu, sehingga persegi komutatif.</desc><defs>
