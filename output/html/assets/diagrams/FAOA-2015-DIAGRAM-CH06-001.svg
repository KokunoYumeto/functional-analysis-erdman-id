<title id="FAOA-2015-DIAGRAM-CH06-001-title">Diagram FAOA-2015-DIAGRAM-CH06-001</title><desc id="FAOA-2015-DIAGRAM-CH06-001-desc">Persegi kealamian pemetaan evaluasi. Panah atas adalah phi dari X ke Y; panah vertikal adalah E sub-X dari X ke C-bintang(X) dan E sub-Y dari Y ke C-bintang(Y); panah bawah adalah C-bintang(phi) dari C-bintang(X) ke C-bintang(Y). Persegi komutatif: C-bintang(phi) setelah E sub-X sama dengan E sub-Y setelah phi.</desc><defs>
