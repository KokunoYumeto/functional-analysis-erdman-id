<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="208.354513pt" height="61.256506pt" viewBox="128.943071 70.6515 208.354513 61.256506" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH06-020-title FAOA-2015-DIAGRAM-CH06-020-desc">
<title id="FAOA-2015-DIAGRAM-CH06-020-title">Diagram FAOA-2015-DIAGRAM-CH06-020</title><desc id="FAOA-2015-DIAGRAM-CH06-020-desc">Dua baris eksak pendek sejajar. Baris atas adalah ruang nol menuju C melalui g ke B melalui p ke D lalu ruang nol; baris bawah mengganti C, B, dan D dengan C prima, B prima, dan D prima serta memakai g prima dan p prima. Panah vertikal U dari B ke B prima dan T dari D ke D prima membuat persegi kanan komutatif: T setelah p sama dengan p prima setelah U. Tidak ada panah vertikal pada C dalam diagram ini.</desc><defs>
