<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="78.287788pt" height="71.927822pt" viewBox="193.876945 72.706693 78.287788 71.927822" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH06-012-title FAOA-2015-DIAGRAM-CH06-012-desc">
<title id="FAOA-2015-DIAGRAM-CH06-012-title">Diagram FAOA-2015-DIAGRAM-CH06-012</title><desc id="FAOA-2015-DIAGRAM-CH06-012-desc">Persegi yang membandingkan dua adjoin operator T pada ruang Hilbert H. Panah atas T prima berjalan dari H bintang ke H bintang; panah bawah T bintang dari H ke H; kedua panah vertikal psi adalah antiisomorfisme dari H ke H bintang. Persegi komutatif: T prima setelah psi sama dengan psi setelah T bintang, ekuivalen dengan T prima sama dengan psi, lalu T bintang, lalu invers psi.</desc><defs>
