<title id="FAOA-2015-DIAGRAM-CH04-005-title">Diagram FAOA-2015-DIAGRAM-CH04-005</title><desc id="FAOA-2015-DIAGRAM-CH04-005-desc">Diagram ruang vektor bebas V pada S. Injeksi iota membawa S ke himpunan dasar V, fungsi f membawa S ke himpunan dasar W, dan panah putus-putus himpunan dasar f tilde membawa himpunan dasar V ke himpunan dasar W; di tingkat ruang vektor terdapat satu-satunya pemetaan linear putus-putus f tilde dari V ke W. Segitiga komutatif: f sama dengan himpunan dasar f tilde setelah iota.</desc><defs>
