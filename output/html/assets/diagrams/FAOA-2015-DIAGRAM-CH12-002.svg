<title id="FAOA-2015-DIAGRAM-CH12-002-title">Diagram FAOA-2015-DIAGRAM-CH12-002</title><desc id="FAOA-2015-DIAGRAM-CH12-002-desc">Barisan eksak pendek aljabar C-bintang: ruang nol menuju A, lalu phi dari A ke E, lalu psi dari E ke B, lalu B menuju ruang nol. Eksak berarti phi injektif, psi surjektif, dan jangkauan phi sama dengan kernel psi. Barisan terbelah bila ada homomorfisme xi dari B ke E dengan psi setelah xi sama dengan identitas B.</desc><defs>
