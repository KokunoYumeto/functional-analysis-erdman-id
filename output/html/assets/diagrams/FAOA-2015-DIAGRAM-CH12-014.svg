<title id="FAOA-2015-DIAGRAM-CH12-014-title">Diagram FAOA-2015-DIAGRAM-CH12-014</title><desc id="FAOA-2015-DIAGRAM-CH12-014-desc">Segitiga teorema hasil bagi untuk aljabar C-bintang. Pemetaan hasil bagi pi berjalan dari A ke A per J, homomorfisme bintang phi dari A ke B, dan satu-satunya homomorfisme bintang phi tilde dari A per J ke B. Segitiga komutatif: phi sama dengan phi tilde setelah pi.</desc><defs>
