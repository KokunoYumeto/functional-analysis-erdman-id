<title id="FAOA-2015-DIAGRAM-CH04-011-title">Diagram FAOA-2015-DIAGRAM-CH04-011</title><desc id="FAOA-2015-DIAGRAM-CH04-011-desc">Diagram sifat universal pelengkapan ruang metrik M. Inklusi iota membawa M ke himpunan dasar pelengkapannya, fungsi f membawa M ke himpunan dasar ruang metrik lengkap N, dan panah putus-putus himpunan dasar f garis-atas membawa himpunan dasar pelengkapan M ke himpunan dasar N; di tingkat ruang metrik terdapat satu-satunya fungsi kontinu seragam putus-putus f garis-atas dari pelengkapan M ke N. Segitiga komutatif: f sama dengan f garis-atas setelah iota.</desc><defs>
