<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="238.514891pt" height="65.657513pt" viewBox="172.848608 72.730894 238.514891 65.657513" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH04-007-title FAOA-2015-DIAGRAM-CH04-007-desc">
<title id="FAOA-2015-DIAGRAM-CH04-007-title">Diagram FAOA-2015-DIAGRAM-CH04-007</title><desc id="FAOA-2015-DIAGRAM-CH04-007-desc">Diagram sifat universal koproduk Q dari A satu dan A dua. Panah inklusi iota satu dan iota dua masing-masing menuju Q; panah f satu dan f dua masing-masing menuju B. Ada satu-satunya panah f dari Q ke B, dan kedua segitiga komutatif: f setelah iota satu sama dengan f satu, serta f setelah iota dua sama dengan f dua.</desc><defs>
