<title id="FAOA-2015-DIAGRAM-CH12-005-title">Diagram FAOA-2015-DIAGRAM-CH12-005</title><desc id="FAOA-2015-DIAGRAM-CH12-005-desc">Ekstensi jumlah langsung yang terbelah: ruang nol menuju A, lalu inklusi iota satu membawa a ke pasangan (a, nol) dalam A tambah langsung B, lalu proyeksi pi dua membawa pasangan ke B, lalu B menuju ruang nol. Barisan eksak dan terbelah oleh inklusi faktor B ke A tambah langsung B.</desc><defs>
