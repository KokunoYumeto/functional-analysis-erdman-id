<title id="FAOA-2015-DIAGRAM-CH17-005-title">Diagram FAOA-2015-DIAGRAM-CH17-005</title><desc id="FAOA-2015-DIAGRAM-CH17-005-desc">Persegi funktorialitas K nol pada aljabar C-bintang beridentitas. Panah atas phi membawa P tak-hingga(A) ke P tak-hingga(B); panah vertikal adalah pemetaan kelas menuju K nol(A) dan K nol(B); panah bawah K nol(phi) membawa K nol(A) ke K nol(B). Persegi komutatif: K nol(phi) dari kelas p sama dengan kelas phi(p).</desc><defs>
