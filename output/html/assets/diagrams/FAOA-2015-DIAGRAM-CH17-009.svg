<title id="FAOA-2015-DIAGRAM-CH17-009-title">Diagram FAOA-2015-DIAGRAM-CH17-009</title><desc id="FAOA-2015-DIAGRAM-CH17-009-desc">Diagram Bratteli untuk homomorfisme dari C ditambah C ke M empat ditambah M tiga. Dua simpul kiri sama-sama berlabel 1; simpul kanan berlabel 4 dan 3. Dari simpul 1 pertama ada tiga sisi ke 4 dan dua sisi ke 3; dari simpul 1 kedua ada satu sisi ke 4 dan satu sisi ke 3. Ini graf multiplisitas, bukan diagram komutatif.</desc><defs>
