<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="204.08111pt" height="93.091577pt" viewBox="130.649429 72.727273 204.08111 93.091577" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH17-004-title FAOA-2015-DIAGRAM-CH17-004-desc">
<title id="FAOA-2015-DIAGRAM-CH17-004-title">Diagram FAOA-2015-DIAGRAM-CH17-004</title><desc id="FAOA-2015-DIAGRAM-CH17-004-desc">Diagram sifat universal K nol untuk aljabar C-bintang beridentitas A. Pemetaan kelas membawa P tak-hingga(A) ke semigrup dasar K nol(A), sedangkan nu membawanya ke semigrup dasar G. Panah putus-putus himpunan dasar nu tilde berasal dari satu-satunya homomorfisme grup putus-putus nu tilde dari K nol(A) ke G. Segitiga komutatif: nu sama dengan nu tilde setelah pemetaan kelas.</desc><defs>
