<title id="FAOA-2015-DIAGRAM-CH17-011-title">Diagram FAOA-2015-DIAGRAM-CH17-011</title><desc id="FAOA-2015-DIAGRAM-CH17-011-desc">Diagram Bratteli untuk homomorfisme tak beridentitas dari M tiga ditambah M dua ditambah M dua ke M sembilan ditambah M tujuh. Dari simpul 3 ada dua sisi ke 9 dan satu sisi ke 7; masing-masing dari dua simpul 2 memiliki satu sisi ke 7 dan tidak memiliki sisi ke 9. Ini graf multiplisitas, bukan diagram komutatif; ketidakberidentitasan tampak dari dimensi yang tidak seluruhnya terpakai di simpul 9.</desc><defs>
