<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="163.565152pt" height="58.371643pt" viewBox="151.337759 72.719996 163.565152 58.371643" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH12-004-title FAOA-2015-DIAGRAM-CH12-004-desc">
<title id="FAOA-2015-DIAGRAM-CH12-004-title">Diagram FAOA-2015-DIAGRAM-CH12-004</title><desc id="FAOA-2015-DIAGRAM-CH12-004-desc">Diagram Lema Lima untuk aljabar C-bintang, dengan dua baris eksak pendek: nol ke A melalui j ke B melalui k ke C ke nol, dan nol ke A prima melalui j prima ke B prima melalui k prima ke C prima ke nol. Panah vertikal f, g, dan h menghubungkan objek dengan versi primanya; kedua persegi komutatif, sehingga g setelah j sama dengan j prima setelah f dan h setelah k sama dengan k prima setelah g.</desc><defs>
