<title id="FAOA-2015-DIAGRAM-CH04-002-title">Diagram FAOA-2015-DIAGRAM-CH04-002</title><desc id="FAOA-2015-DIAGRAM-CH04-002-desc">Diagram sifat universal bagi funktor F. Ada panah u dari B ke F(A), panah f dari B ke F(A prima), dan panah putus-putus F(f tilde) dari F(A) ke F(A prima), yang berasal dari satu-satunya panah putus-putus f tilde dari A ke A prima. Segitiga komutatif: f sama dengan F(f tilde) setelah u.</desc><defs>
