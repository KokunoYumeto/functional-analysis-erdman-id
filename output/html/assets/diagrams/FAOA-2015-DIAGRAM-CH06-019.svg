<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="281.843916pt" height="63.352645pt" viewBox="129.519583 70.658588 281.843916 63.352645" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH06-019-title FAOA-2015-DIAGRAM-CH06-019-desc">
<title id="FAOA-2015-DIAGRAM-CH06-019-title">Diagram FAOA-2015-DIAGRAM-CH06-019</title><desc id="FAOA-2015-DIAGRAM-CH06-019-desc">Dua baris eksak pendek sejajar. Baris atas adalah ruang nol menuju A melalui j ke B melalui f ke C lalu ruang nol; baris bawah mengganti A, B, dan C dengan A prima, B prima, dan C prima serta memakai j prima dan f prima. Panah vertikal S dari A ke A prima dan U dari B ke B prima membuat persegi kiri komutatif: U setelah j sama dengan j prima setelah S. Tidak ada panah vertikal pada C dalam diagram ini.</desc><defs>
