<title id="FAOA-2015-DIAGRAM-CH17-008-title">Diagram FAOA-2015-DIAGRAM-CH17-008</title><desc id="FAOA-2015-DIAGRAM-CH17-008-desc">Rantai pemetaan yang menjelaskan multiplisitas m sub-i-j: aljabar matriks M sub-k-j masuk ke jumlah langsung A, lalu A dipetakan ke B melalui phi, lalu diproyeksikan ke komponen M sub-n-i. Multiplisitas m sub-i-j adalah multiplisitas komposit ini. Ini rantai berarah, bukan diagram komutatif bercabang.</desc><defs>
