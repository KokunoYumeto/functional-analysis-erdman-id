<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="70.862729pt" height="65.377115pt" viewBox="197.340428 72.727269 70.862729 65.377115" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH16-008-title FAOA-2015-DIAGRAM-CH16-008-desc">
<title id="FAOA-2015-DIAGRAM-CH16-008-title">Diagram FAOA-2015-DIAGRAM-CH16-008</title><desc id="FAOA-2015-DIAGRAM-CH16-008-desc">Segitiga pengangkatan monomorfisme tau. Pemetaan tau tilde membawa A ke B(H), pemetaan hasil bagi pi membawa B(H) ke aljabar Calkin Q(H), dan tau membawa A langsung ke Q(H). Segitiga komutatif: pi setelah tau tilde sama dengan tau. Dalam proposisi ini tau tilde harus linear, beridentitas, dan positif lengkap.</desc><defs>
