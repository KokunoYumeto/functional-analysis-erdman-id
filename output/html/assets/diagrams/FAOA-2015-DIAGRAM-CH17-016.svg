<title id="FAOA-2015-DIAGRAM-CH17-016-title">Diagram FAOA-2015-DIAGRAM-CH17-016</title><desc id="FAOA-2015-DIAGRAM-CH17-016-desc">Barisan eksak terbelah untuk unitalisasi A. Ruang nol menuju A, lalu inklusi iota dari A ke A tilde, lalu pemetaan hasil bagi Q dari A tilde ke bilangan kompleks, lalu menuju ruang nol. Panah balik psi dari bilangan kompleks ke A tilde membelah Q, sehingga Q setelah psi sama dengan identitas pada bilangan kompleks.</desc><defs>
