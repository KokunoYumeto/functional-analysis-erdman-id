<title id="FAOA-2015-DIAGRAM-CH06-021-title">Diagram FAOA-2015-DIAGRAM-CH06-021</title><desc id="FAOA-2015-DIAGRAM-CH06-021-desc">Persegi dengan A di kiri atas, D di kanan atas, A prima di kiri bawah, dan D prima di kanan bawah. Panah atas adalah komposit p setelah j dari A ke D; panah bawah adalah p prima setelah j prima dari A prima ke D prima; panah vertikalnya S dan T. Persegi komutatif: T setelah p setelah j sama dengan p prima setelah j prima setelah S. Kedua panah horizontal merupakan isomorfisme.</desc><defs>
