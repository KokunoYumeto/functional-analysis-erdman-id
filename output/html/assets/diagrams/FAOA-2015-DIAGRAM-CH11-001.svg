<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="73.640397pt" height="67.687261pt" viewBox="196.358916 72.769685 73.640397 67.687261" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH11-001-title FAOA-2015-DIAGRAM-CH11-001-desc">
<title id="FAOA-2015-DIAGRAM-CH11-001-title">Diagram FAOA-2015-DIAGRAM-CH11-001</title><desc id="FAOA-2015-DIAGRAM-CH11-001-desc">Diagram segitiga yang mengidentifikasi transformasi Gelfand dengan fungsi pada lingkaran satuan. Homeomorfisme psi membawa lingkaran satuan T ke ruang ideal maksimal Delta l satu dari Z; fungsi G sub-a membawa T ke bilangan kompleks; transformasi Gelfand Gamma sub-a membawa Delta l satu dari Z ke bilangan kompleks. Segitiga komutatif: G sub-a sama dengan Gamma sub-a setelah psi.</desc><defs>
