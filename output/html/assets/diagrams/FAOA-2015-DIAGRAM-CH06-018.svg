<title id="FAOA-2015-DIAGRAM-CH06-018-title">Diagram FAOA-2015-DIAGRAM-CH06-018</title><desc id="FAOA-2015-DIAGRAM-CH06-018-desc">Barisan eksak pendek kedua: ruang nol menuju C, lalu g dari C ke B, lalu p dari B ke D, lalu D menuju ruang nol. Eksak berarti g injektif, p surjektif, dan jangkauan g sama dengan kernel p. Bersama barisan sebelumnya, syarat f setelah g sama dengan identitas C menghasilkan isomorfisme p setelah j dari A ke D.</desc><defs>
