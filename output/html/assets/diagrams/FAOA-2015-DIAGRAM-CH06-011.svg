<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="260.758816pt" height="61.113646pt" viewBox="150.604683 72.723729 260.758816 61.113646" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH06-011-title FAOA-2015-DIAGRAM-CH06-011-desc">
<title id="FAOA-2015-DIAGRAM-CH06-011-title">Diagram FAOA-2015-DIAGRAM-CH06-011</title><desc id="FAOA-2015-DIAGRAM-CH06-011-desc">Dua baris eksak pendek. Baris atas: nol ke B melalui tau sub-B ke B bintang-bintang melalui pi sub-B ke B garis-atas ke nol. Baris bawah mengganti B dengan C. Panah vertikalnya T, T bintang-bintang, dan satu-satunya panah putus-putus T garis-atas. Kedua persegi komutatif: T bintang-bintang setelah tau sub-B sama dengan tau sub-C setelah T, dan T garis-atas setelah pi sub-B sama dengan pi sub-C setelah T bintang-bintang.</desc><defs>
