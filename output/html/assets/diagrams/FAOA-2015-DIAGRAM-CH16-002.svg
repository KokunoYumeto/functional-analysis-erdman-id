<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="257.454104pt" height="50.944161pt" viewBox="153.909395 72.730817 257.454104 50.944161" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH16-002-title FAOA-2015-DIAGRAM-CH16-002-desc">
<title id="FAOA-2015-DIAGRAM-CH16-002-title">Diagram FAOA-2015-DIAGRAM-CH16-002</title><desc id="FAOA-2015-DIAGRAM-CH16-002-desc">Diagram ekuivalensi dua ekstensi K oleh A. Kedua baris eksak adalah nol menuju K melalui iota ke E atau E prima, lalu melalui phi atau phi prima ke A, lalu nol. Panah vertikal adalah pembatasan psi pada K, isomorfisme psi dari E ke E prima, dan identitas pada A. Kedua persegi komutatif, sehingga psi menyelaraskan penyertaan ideal K dan pemetaan hasil bagi ke A.</desc><defs>
