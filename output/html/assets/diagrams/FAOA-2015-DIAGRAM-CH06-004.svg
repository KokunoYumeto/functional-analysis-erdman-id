<title id="FAOA-2015-DIAGRAM-CH06-004-title">Diagram FAOA-2015-DIAGRAM-CH06-004</title><desc id="FAOA-2015-DIAGRAM-CH06-004-desc">Potongan barisan ruang Banach: elipsis menuju B sub-n minus satu, lalu panah T sub-n ke B sub-n, lalu panah T sub-n plus satu ke B sub-n plus satu, lalu elipsis. Barisan eksak di B sub-n bila jangkauan T sub-n sama dengan kernel T sub-n plus satu. Ini barisan berarah, bukan diagram komutatif bercabang.</desc><defs>
