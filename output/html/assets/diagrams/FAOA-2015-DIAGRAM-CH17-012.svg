<title id="FAOA-2015-DIAGRAM-CH17-012-title">Diagram FAOA-2015-DIAGRAM-CH17-012</title><desc id="FAOA-2015-DIAGRAM-CH17-012-desc">Diagram Bratteli biner untuk limit induktif C(K), dengan K himpunan Cantor. Satu simpul awal berlabel 1 bercabang menjadi dua simpul 1; pada setiap tahap, setiap simpul 1 kembali bercabang ke dua simpul 1 pada tahap berikutnya, semuanya dengan satu sisi. Jumlah simpul menjadi dua pangkat j pada tahap j. Ini graf multiplisitas, bukan diagram komutatif.</desc><defs>
