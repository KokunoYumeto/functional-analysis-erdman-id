<title id="FAOA-2015-DIAGRAM-CH04-008-title">Diagram FAOA-2015-DIAGRAM-CH04-008</title><desc id="FAOA-2015-DIAGRAM-CH04-008-desc">Diagram universalitas koproduk melalui funktor diagonal D. Panah iota membawa A, yaitu pasangan A satu dan A dua, ke D(Q); panah f membawa A ke D(B); panah putus-putus D(f tilde) membawa D(Q) ke D(B), berasal dari satu-satunya panah putus-putus f tilde dari Q ke B. Segitiga komutatif: f sama dengan D(f tilde) setelah iota.</desc><defs>
