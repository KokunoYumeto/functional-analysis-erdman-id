<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="269.777414pt" height="23.573815pt" viewBox="141.586085 72.643145 269.777414 23.573815" role="img" aria-labelledby="FAOA-2015-DIAGRAM-CH16-001-title FAOA-2015-DIAGRAM-CH16-001-desc">
<title id="FAOA-2015-DIAGRAM-CH16-001-title">Diagram FAOA-2015-DIAGRAM-CH16-001</title><desc id="FAOA-2015-DIAGRAM-CH16-001-desc">Diagram ekstensi Toeplitz yang sering dipakai: ruang nol menuju aljabar operator kompak K(H pangkat dua), lalu menuju aljabar Toeplitz, lalu epimorfisme beta ke aljabar fungsi kontinu pada lingkaran satuan, lalu menuju ruang nol. Ada panah balik T dari aljabar fungsi itu ke aljabar Toeplitz, dengan beta setelah T sama dengan identitas. Namun T bukan homomorfisme bintang, sehingga diagram bukan ekstensi terbelah dalam kategori aljabar C-bintang.</desc><defs>
