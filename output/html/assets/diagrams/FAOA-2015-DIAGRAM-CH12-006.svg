<title id="FAOA-2015-DIAGRAM-CH12-006-title">Diagram FAOA-2015-DIAGRAM-CH12-006</title><desc id="FAOA-2015-DIAGRAM-CH12-006-desc">Diagram ekuivalensi kuat dua ekstensi A oleh B. Baris atas dan bawah masing-masing adalah nol menuju A menuju E atau E prima menuju B menuju nol. Panah vertikal pada A dan B adalah identitas, sedangkan panah tengah adalah isomorfisme bintang theta dari E ke E prima. Kedua persegi komutatif, sehingga theta menghormati penyertaan A dan pemetaan hasil bagi ke B.</desc><defs>
