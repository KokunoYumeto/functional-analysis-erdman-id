<title id="FAOA-2015-DIAGRAM-CH03-001-title">Diagram FAOA-2015-DIAGRAM-CH03-001</title><desc id="FAOA-2015-DIAGRAM-CH03-001-desc">Segitiga teorema dasar hasil bagi untuk ruang vektor. Pemetaan hasil bagi pi berjalan dari V ke V per M, pemetaan linear T dari V ke W, dan satu-satunya pemetaan linear T tilde dari V per M ke W. Segitiga komutatif: T sama dengan T tilde setelah pi.</desc><defs>
